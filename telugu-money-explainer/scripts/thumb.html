<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+Telugu:wght@900&family=Ramabhadra&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;font-family:"Noto Sans Telugu"}
.bg{position:absolute;inset:0;background:url(file:///tmp/thumbbg.jpg) 62% 40%/cover;filter:saturate(1.1) contrast(1.08)}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,16,12,.92) 0%,rgba(20,16,12,.75) 38%,rgba(20,16,12,0) 62%)}
.brand{position:absolute;left:40px;top:34px;display:flex;gap:10px;align-items:center;font-family:Ramabhadra;font-size:30px;color:#fff6e6}
.brand i{width:44px;height:44px;border:3px solid #1b1714;border-radius:10px;background:#f2b632;color:#1b1714;display:grid;place-items:center;font-style:normal;padding-top:4px}
.k{position:absolute;left:40px;top:112px;font-family:Ramabhadra;font-size:46px;color:#fff6e6}
.big{position:absolute;left:34px;top:186px;font-family:Anton;font-size:178px;line-height:1;color:#d93a26;-webkit-text-stroke:5px #fff6e6;paint-order:stroke fill;text-shadow:10px 10px 0 #1b1714}
.q{position:absolute;left:40px;top:430px;background:#f2b632;border:6px solid #1b1714;border-radius:18px;box-shadow:10px 10px 0 #1b1714;padding:14px 26px 6px;font-family:Ramabhadra;font-size:66px;line-height:1.15;color:#1b1714;transform:rotate(-2deg)}
.tag{position:absolute;right:36px;bottom:34px;background:#1b1714;color:#fff6e6;font-family:Anton;font-size:40px;padding:8px 20px 4px;border-radius:12px}
</style></head><body>
<div class="bg"></div><div class="fade"></div>
<div class="brand"><i>అ</i>అసలు లెక్క</div>
<div class="k">ఒక్క wine shop application</div>
<div class="big">₹3,00,000</div>
<div class="q">ఓనర్‌కి ఎంత మిగులుతుంది?</div>
<div class="tag">1 SHOP : 36</div>
</body></html>
