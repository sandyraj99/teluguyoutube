<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@800;900&family=Inter:wght@900&display=block" rel="stylesheet">
<style>*{margin:0;box-sizing:border-box}body{width:1280px;height:720px;overflow:hidden;font-family:"Noto Sans Telugu";position:relative}
.ph{position:absolute;inset:0;background:url({{PHOTO}}) {{POS}}/cover;filter:brightness(1.12) saturate(1.2) contrast(1.05)}
.fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.97) 0%,rgba(255,255,255,.9) 34%,rgba(255,255,255,.35) 52%,rgba(255,255,255,0) 64%)}
.wrap{position:absolute;top:26px;left:0;right:0;text-align:center}
h1{font-weight:900;font-size:128px;line-height:1.05;letter-spacing:-1px}
h1 .r{color:#d4231c;position:relative;display:inline-block}
h1 .r::after{content:"";position:absolute;left:4%;right:0;bottom:-2px;height:12px;background:#d4231c;border-radius:50%;transform:rotate(-2deg)}
h1 .k{color:#111}
.y{display:inline-block;background:#ffe234;color:#111;font-weight:900;font-size:54px;padding:2px 30px 8px;margin-top:22px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.rd{display:inline-block;background:#d4231c;color:#fff;font-weight:900;font-size:44px;padding:2px 26px 8px;margin-top:14px;transform:rotate(-1.2deg);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.rd b{color:#ffe234;font-family:Inter,"Noto Sans Telugu"}
</style></head><body><div class="ph"></div><div class="fade"></div>
<div class="wrap"><h1><span class="r">{{RED}}</span> <span class="k">{{BLACK}}</span></h1>
<div class="y">{{YELLOW}}</div><br>
<div class="rd">{{STRIP}}</div></div></body></html>
